# Render Blueprint: New → Blueprint → выбрать этот репозиторий.
# Создаёт бесплатный веб-сервис (Docker) и бесплатную PostgreSQL.
services:
  - type: web
    name: metka
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metka-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # Render спросит значение при создании — пароль для входа под логином admin

databases:
  - name: metka-db
    plan: free
    databaseName: metka
    user: metka
